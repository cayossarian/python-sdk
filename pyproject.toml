[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ebus-sdk"
version = "0.1.0"
description = "Python SDK for Homie MQTT Convention (eBus)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "eBus Contributors"}
]
keywords = ["mqtt", "homie", "iot", "ebus"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "paho-mqtt>=1.6.1",
]

[project.optional-dependencies]
mdns = ["zeroconf>=0.131.0"]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/spanio/eBus-MQTT-Convention"
Repository = "https://github.com/spanio/python-sdk"

[tool.setuptools.packages.find]
where = ["src"]
